[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-keycloak"
version = "0.4.0"
description = "Keycloak OIDC integration for Django"
requires-python = ">=3.11"
dependencies = [
    "Django>=4.2",
    "Authlib>=1.3",
    "joserfc>=1.0",
    "requests>=2.32",
]

[tool.setuptools.packages.find]
where = ["src"]
